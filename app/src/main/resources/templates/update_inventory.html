<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Inventory</title>
    <link rel="icon" th:href="@{/assets/sidebar/cmp_logo.png}">
    <link rel="stylesheet" th:href="@{/css/variables.css}">
    <link rel="stylesheet" th:href="@{/css/base.css}">
    <link rel="stylesheet" th:href="@{/css/topbar.css}">
    <link rel="stylesheet" th:href="@{/css/sidebar.css}">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700&family=Poppins:wght@500&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/modal.css}">
<link rel="stylesheet" th:href="@{/css/update_inventory.css}">
</head>
<body>
    <div th:replace="~{partials/topbar :: topbar}"></div>
    <div th:replace="~{partials/sidebar :: sidebar}"></div>
    <main class="main-content">
<p class="last-updated">
    🕒 Last Updated: 18 Jun 2026, 05:45 PM
</p>

<nav class="widget">

    <!-- Add Stock -->
    <div class="cards" id="addstock">
        <img th:src="@{/assets/update_inventory/icon_add_stock.png}" alt="">
        <button type="button">Purchase Stock</button>
        <span class="yellow_line"></span>
    </div>

    <!-- New Model -->
    <div class="cards" id="newmodel">
        <img th:src="@{/assets/update_inventory/icon_add_model.png}" alt="">
        <button type="button">New Model</button>
        <span class="yellow_line"></span>
    </div>

    <!-- New Dimension -->
    <div class="cards" id="newdim">
        <img th:src="@{/assets/update_inventory/icon_add_dim.png}" alt="">
        <button type="button">New Dimension</button>
        <span class="yellow_line"></span>
    </div>

    <!-- New Grade -->
    <div class="cards" id="newgrade">
        <img th:src="@{/assets/update_inventory/icon_add_grade.png}" alt="">
        <button type="button">New Grade</button>
        <span class="yellow_line"></span>
    </div>

    <!-- Remove Stock -->
    <div class="cards" id="removestock">
        <img th:src="@{/assets/update_inventory/icon_delete_stock.png}" alt="">
        <button type="button">Sell Stock</button>
        <span class="yellow_line"></span>
    </div>

    <!-- Delete Model -->
    <div class="cards" id="deletemodel">
        <img th:src="@{/assets/update_inventory/icon_delete_model.png}" alt="">
        <button type="button">Delete Model</button>
        <span class="yellow_line"></span>
    </div>

    <!-- Delete Dimension -->
    <div class="cards" id="deletedim">
        <img th:src="@{/assets/update_inventory/icon_delete_dim.png}" alt="">
        <button type="button">Delete Dimension</button>
        <span class="yellow_line"></span>
    </div>

    <!-- Delete Grade -->
    <div class="cards" id="deletegrade">
        <img th:src="@{/assets/update_inventory/icon_delete_grade.png}" alt="">
        <button type="button">Delete Grade</button>
        <span class="yellow_line"></span>
    </div>

</nav>

<!-- =========================================================
     REUSABLE MODAL — one shell, reused by every card above.
     modal.js fills #popupFields with the right inputs for
     whichever action was clicked.
========================================================= -->

<div id="overlay" class="overlay"></div>

<div id="popup" class="popup" role="dialog" aria-modal="true" aria-labelledby="popupTitle" aria-hidden="true">

    <div class="popup-header">
        <h2 id="popupTitle">Inventory</h2>
        <button class="close-btn" type="button" data-modal-close aria-label="Close dialog">&times;</button>
    </div>

    <p class="popup-description" id="popupDescription" hidden></p>

    <form id="popupForm" novalidate>

        <div class="popup-fields" id="popupFields"></div>

        <div class="popup-buttons">
            <button type="button" class="cancel" data-modal-close>Cancel</button>
            <button type="submit" class="save" id="popupSubmit">Save</button>
        </div>

    </form>

</div>
    </main>
    <script th:src="@{/js/sidebar.js}" defer></script>
    <script th:src="@{/js/inventory-data.js}"></script>
<script th:src="@{/js/modal.js}"></script>
<script th:src="@{/js/update_inventory.js}"></script>
</body>
</html>
